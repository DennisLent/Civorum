[workspace]
members = [
  "crates/core",
  "crates/content",
  "crates/rules",
  "crates/generators",
  "crates/replay",
  "crates/benchmark",
  "crates/bots",
  "crates/cli",
  "crates/server",
  "crates/viewer_api",
]
default-members = ["crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde", "v4"] }
rand = "0.9"
rand_chacha = "0.10.0"
